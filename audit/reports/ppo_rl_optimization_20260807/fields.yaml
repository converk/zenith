field_categories:
  - category: "Overview"
    category_en: "Overview"
    fields:
      - name: conclusion
        description: "该研究项的核心结论，一句话给出明确判断"
        detail_level: brief
        required: true
      - name: evidence_type
        description: "证据类型：论文实证 / 开源项目实证 / 领域实践 / 推测（可组合，用顿号分隔）"
        detail_level: brief
        required: true
      - name: confidence
        description: "置信度：高 / 中 / 低"
        detail_level: brief
        required: true
  - category: "Analysis"
    category_en: "Analysis"
    fields:
      - name: mechanism
        description: "作用机制与理论依据"
        detail_level: moderate
        required: true
      - name: addresses
        description: "具体解决哪些已观测问题（例如对 SFT 只打平、update 100 后平台期、后期对启发式退化、立直过度激进、value explained variance 低等）"
        detail_level: moderate
        required: true
      - name: limitations
        description: "局限与不能解决的问题"
        detail_level: moderate
        required: true
      - name: risks
        description: "风险、reward hacking 可能性与规避方法"
        detail_level: moderate
        required: true
  - category: "Implementation"
    category_en: "Implementation"
    fields:
      - name: data_requirements
        description: "需要的数据与特征（现有 SFT 数据集、mjson 日志、规则特征 shanten/ukeire/suji/风险等）"
        detail_level: moderate
        required: true
      - name: architecture
        description: "推荐架构设计：模型结构、输入输出、是否复用现有 backbone，不改 backbone 结构"
        detail_level: detailed
        required: true
      - name: integration
        description: "与现有 PPO worker/learner/rewards 组件的集成方式与代码改动点"
        detail_level: detailed
        required: true
      - name: hyperparameters
        description: "关键超参与建议取值"
        detail_level: detailed
        required: true
      - name: compute_cost
        description: "算力与时间成本评估（2 GPU、12 workers 前提）"
        detail_level: brief
        required: true
  - category: "Experiments"
    category_en: "Experiments"
    fields:
      - name: experiment_hypothesis
        description: "对应实验的假设"
        detail_level: moderate
        required: true
      - name: experiment_changes
        description: "改动点（配置、代码、数据）"
        detail_level: detailed
        required: true
      - name: experiment_metrics
        description: "期望观察指标（训练曲线、2v2 320 半庄胜率、95% CI、立直利用率等）"
        detail_level: moderate
        required: true
      - name: experiment_duration
        description: "最少实验时长（update 数/GPU 小时）"
        detail_level: brief
        required: true
      - name: success_criteria
        description: "成功判定标准"
        detail_level: moderate
        required: true
  - category: "References"
    category_en: "References"
    fields:
      - name: papers
        description: "关键论文（含标题、作者/年份、arXiv 或期刊链接）"
        detail_level: moderate
        required: true
      - name: projects
        description: "开源项目/代码链接（如 smly/RiichiEnv、开源麻将 RL 项目等）"
        detail_level: moderate
        required: true
      - name: implementation_notes
        description: "实现注意点与踩坑提示"
        detail_level: moderate
        required: true
uncertain: []
