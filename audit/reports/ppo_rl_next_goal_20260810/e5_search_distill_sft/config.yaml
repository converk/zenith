# 搜索蒸馏变体 B（SFT 基座对照）：从 best_heuristic.pt 初始化 + 纯 GRP 奖励 +
# 搜索 KL 监督（200 update）。与变体 A（E3-b 基座）的唯一差异是 init_model；
# 其余（GRP λ=1.0、sft_kl=0、search_distill_coef=0.5、数据集、评测）完全一致。
grp_model_path: checkpoints/train_riichi_ppo_goal_grp/grp_rank_predictor.pt
grp_pts_weight: [10, 4, -4, -10]
grp_mix_lambda: 1.0

kyokus_per_worker: 16
iterations: 200
checkpoint_interval_updates: 50
checkpoint_dir: checkpoints/train_riichi_ppo_next_search_distill_sft
init_model: checkpoints/train_riichi_v13_sft/best_heuristic.pt
evaluation_enabled: true
evaluation_interval_updates: 30
evaluation_hanchan_count: 96

sft_kl_coef_start: 0.0
sft_kl_coef_end: 0.0
search_distill_path: audit/reports/ppo_rl_next_goal_20260810/search_distill_data_combined
search_distill_coef_start: 0.5
search_distill_coef_end: 0.5
search_distill_anneal_updates: 200
search_distill_batch_size: 64
