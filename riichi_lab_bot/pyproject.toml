[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riichi-lab-bot"
version = "0.1.0"
description = "Standalone RiichiLab client for Zenith semantic-token checkpoints"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "torch==2.7.1",
  "websockets==16.1.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
riichi-lab-bot = "riichi_lab_bot.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
