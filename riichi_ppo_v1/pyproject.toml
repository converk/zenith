[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riichi-ppo-v1"
version = "0.1.0"
description = "PPO training for RiichiEnv with semantic state tokens and a fixed action space"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "ray[default]>=2.9",
  "tensorboard>=2.14",
  "torch>=2.2",
]

[project.scripts]
riichi-ppo-train = "riichi_ppo_v1.training.train:main"
riichi-ppo-smoke = "riichi_ppo_v1.training.train:smoke_main"
riichi-ppo-validate = "riichi_ppo_v1.tools.validate:main"
riichi-sft-prepare = "riichi_ppo_v1.sft.prepare:main"
riichi-sft-train = "riichi_ppo_v1.sft.train:main"
riichi-sft-precompute = "riichi_ppo_v1.sft.precompute:main"

[tool.setuptools]
packages = [
  "riichi_ppo_v1",
  "riichi_ppo_v1.evaluation",
  "riichi_ppo_v1.model",
  "riichi_ppo_v1.training",
  "riichi_ppo_v1.training.rewards",
  "riichi_ppo_v1.sft",
]
package-dir = {riichi_ppo_v1 = "."}

[tool.setuptools.package-data]
riichi_ppo_v1 = ["configs/*.yaml"]
