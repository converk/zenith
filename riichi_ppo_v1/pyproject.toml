[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riichi-ppo-v1"
version = "0.1.0"
description = "PPO training for RiichiEnv with KyokuEventTuple V3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "ray[default]>=2.9",
  "tensorboard>=2.14",
  "torch>=2.2",
]

[project.scripts]
riichi-ppo-train = "riichi_ppo_v1.train:main"
riichi-ppo-smoke = "riichi_ppo_v1.train:smoke_main"
riichi-ppo-validate = "riichi_ppo_v1.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riichi_ppo_v1 = ["*.yaml"]
