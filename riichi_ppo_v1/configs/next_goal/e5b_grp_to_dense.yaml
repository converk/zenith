# E5-b 臂1：两阶段奖励课程「GRP→dense」。
# resume E3-b u200（纯 GRP，2v2 唯一显著为正的臂），后续 200 update 叠加 dense=0.05，
# 检验“先学 GRP 终局目标、再补效率稳定性”是否能兼得 u200 2v2 与启发式稳定性。
grp_model_path: checkpoints/train_riichi_ppo_goal_grp/grp_rank_predictor.pt
grp_pts_weight: [10, 4, -4, -10]
grp_mix_lambda: 1.0
dense_efficiency_weight: 0.05

kyokus_per_worker: 16
iterations: 400
checkpoint_interval_updates: 50
checkpoint_dir: checkpoints/train_riichi_ppo_next_e5b_grp_to_dense
resume: checkpoints/train_riichi_ppo_goal_e3_grp_reward/checkpoint_00200.pt
evaluation_enabled: true
evaluation_interval_updates: 30
evaluation_hanchan_count: 96
