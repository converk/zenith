seed: 1
device: cuda
learner_gpus: 2
model_size: mid
context_tokens: 4096
critic_layers: 2
epochs: 1
batch_size: 512
learning_rate: 0.00015
min_learning_rate: 0.00002
warmup_fraction: 0.02
weight_decay: 0.01
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 0.00000001
max_grad_norm: 1.0
train_critic: false
train_public_value: false
policy_head_type: isolated_action_query
group_coef: 0.25
public_value_coef: 0.0
rule_coef: 0.05
rule_decay_fraction: 0.20
gamma: 0.99
inference_dtype: bf16
shuffle_buffer_kyokus: 8192
# 在 32 个 batch 的窗口内按长度分桶，再随机打乱 batch 顺序；减少 padding 而不形成长度课程。
length_bucket_window_batches: 32
log_interval_steps: 100
validation_max_samples: 0
validation_samples_per_run: 150000
# 固定种子、四座轮换；候选 SFT actor 使用合法掩码下的确定性 argmax。
heuristic_evaluation_enabled: true
heuristic_evaluation_parallel_hanchan_count: 24
heuristic_evaluation_seed_base: 20260717
heuristic_evaluation_game_mode: 4p-red-half
heuristic_evaluation_max_steps: 4000
checkpoint_dir: checkpoints/train_riichi_v13/sft
tensorboard_enabled: true
tensorboard_dirname: tensorboard
resume: null
