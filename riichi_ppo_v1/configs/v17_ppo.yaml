# V17 PPO(Mortal 式 GRP 纯奖励):自包含完整配置,不与打包默认叠加。
# 特性:
# - 纯 GRP reward(utility [1, 1/3, -1/3, -1]),无小局点差分量;
# - 每 update 收集 512 个完整半庄(rollout 停止条件为完整半庄数);
# - 2 GPU DDP,minibatch_size=1536/GPU → global effective 3072;
#   update_epochs=2;若 1536/GPU 因最长序列显存不足,可用
#   gradient_accumulation_steps=2(此时 per-GPU 每次 step 仍按 1536 语义,
#   把 3072 拆成 2 步累积)但全局 effective batch 保持 ≈3072;
# - Q-Boosting 保留适度减弱;SFT KL 为中等偏弱长期 anchor;
# - 对手纯 current self-play;
# - 每 5 updates 保存 checkpoint 并 1v3 vs V16 SFT 评测 4000 半庄,
#   最终选择 1V3 表现最佳 checkpoint。
seed: 1
device: cuda
learner_gpus: 2
iterations: 100
model_size: v16
context_tokens: 4096
policy_head_type: symmetric_action_query
critic_layers: 2
inference_dtype: bf16
game_mode: 4p-red-half

# V17 前置产物:V16 SFT 权重(初始化 + 1v3 对手 + SFT KL reference),
# 冻结的 Mortal GRP(v17 离线训练产物)。
init_model: checkpoints/train_riichi_v16/sft/best.pt
grp_checkpoint: checkpoints/train_riichi_v17/grp/best.pt

# Rollout 与推理拓扑(512 完整半庄/update)。
num_workers: 12
envs_per_worker: 32
env_step_threads: 4
inference_max_batch_size: 512
inference_batch_wait_ms: 5.0
inference_batch_target_rows: 0
inference_batch_target_workers: 0
games_per_update: 512

# PPO 超参(Mortal GRP 纯奖励;batch 增大不线性放大 LR)。
gamma: 1.0
qboost_lambda: 0.95
top3_q_candidates: 3
ppo_clip: 0.2
update_epochs: 2
# 每 GPU minibatch 1536 → 两卡 global effective 3072。
minibatch_size: 1536
gradient_accumulation_steps: 1
update_batch_mode: streaming
# 熵退火:0.01 → 0.005;避免上轮 0.229→0.110→0.050→0.025 的快速坍缩。
entropy_start: 0.01
entropy_end: 0.005
value_coef: 0.5
q_coef: 1.0
# Q-Boosting 适度减弱(防后期熵再次快速塌缩)。
q_boost_coef: 0.05
q_boost_lambda: 1.0
q_temperature: 1.5
value_loss: huber
value_target_normalization: batch_std
value_target_std_floor: 0.01
max_grad_norm: 0.5
target_kl: 0.01
learning_rate: 0.00002
actor_learning_rate: 0.00002
shared_learning_rate: 0.000005
critic_learning_rate: 0.00004
total_updates: 100
warmup_fraction: 0.02
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 0.00001
weight_decay: 0.01

# 稳定性:前面 2 updates 只训 critic + Q(随机初始化预热),再联合训练;
# SFT KL 为中等偏弱长期 anchor(U 形:0.002 → 0.0005 → 0.001)。
critic_bootstrap_updates: 2
critic_bootstrap_learning_rate: 0.00002
critic_public_grad_scale: 0.25
sft_kl_coef_start: 0.002
sft_kl_coef_middle: 0.0005
sft_kl_coef_end: 0.001
sft_kl_middle_fraction: 0.5

# 每 5 updates 保存 checkpoint & 4000 半庄 1v3 评测(u005..u100 全部评测)。
checkpoint_interval_updates: 5
checkpoint_dir: checkpoints/train_riichi_v17/ppo
resume: null

# 对手:只使用 current self-play(opponent_mix 关闭 = 全 current 席位)。
opponent_mix:
  enabled: false

# 唯一评测机制 1v3:10 进程 × 400 = 4000 半庄;对手固定 V16 SFT。
eval1v3_enabled: true
eval1v3_model_b: checkpoints/train_riichi_v16/sft/best.pt
eval1v3_seed_base: 20260819
# CUDA_DEVICE=0,2(物理 GPU 0,3):10 个评测分片子进程按 5/5 分摊到两张卡。
eval1v3_devices: ["0", "2"]
eval1v3_output_dir: audit/reports/v17/eval

progress_update_interval_updates: 5