# V17 GRP 离线训练(Mortal 方案):自包含完整配置,不与打包默认叠加。
# 数据集由 prepare 命令先行构造;训练后 GRP 完全冻结,PPO 阶段只读。
# 保存 validation loss 最低的 checkpoint(best.pt),每 val_interval_steps 步
# 在验证集上评估一次。
seed: 1
device: cuda
epochs: 15
batch_size: 512
learning_rate: 0.00001
weight_decay: 0.0
max_grad_norm: 1.0
shuffle_buffer_samples: 65536
log_interval_steps: 100
val_interval_steps: 200
checkpoint_dir: checkpoints/train_riichi_v17/grp