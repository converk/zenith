# V16 PPO:从 V16 SFT 初始化、Top-3 Q-boosting、70% GRP + 30% 分差奖励。
# 自包含完整配置,不与打包默认叠加;1v3 机制节奏键(10 进程 × 160 半庄、每
# 30 updates)不在本文件复制,由 evaluation/mechanism.py 单一来源提供。
seed: 1
device: cuda
learner_gpus: 2
iterations: 1200
model_size: v16
context_tokens: 4096
policy_head_type: symmetric_action_query
critic_layers: 2
inference_dtype: bf16
game_mode: 4p-red-half

# V16 前置产物:SFT 权重、冻结 GRP 与离线归一化统计量。
init_model: checkpoints/train_riichi_v16/sft/best.pt
grp_checkpoint: checkpoints/train_riichi_v16/grp/best.pt
grp_dataset: datasets/tenhou_grp_2024_2025_v16

# Rollout 与推理拓扑。
num_workers: 12
envs_per_worker: 32
env_step_threads: 4
inference_max_batch_size: 512
inference_batch_wait_ms: 5.0
inference_batch_target_rows: 0
inference_batch_target_workers: 0
kyokus_per_worker: 16

# 标准 PPO;小局边界奖励 = 70% 归一化 GRP delta + 30% 归一化分差。
gamma: 1.0
qboost_lambda: 0.95
top3_q_candidates: 3
ppo_clip: 0.2
update_epochs: 4
minibatch_size: 512
update_batch_mode: streaming
entropy_start: 0.01
entropy_end: 0.001
value_coef: 0.5
q_coef: 1.0
# Dueling Q-boosting:Q_i = V(s) + A_i,A_i 是候选集合内以重归一化概率
# 为基线的相对优势;只有行为动作回归到与 Value 相同的 return 目标。
# p_boost ∝ p_i·exp(q_boost_lambda·A_i/q_temperature) 作为 detach 蒸馏
# 目标,q_boost_coef 是其辅助 loss 权重。qboost_lambda(上方 0.95)是
# Expected-SARSA 资格迹衰减,两者独立。
q_boost_coef: 0.1
q_boost_lambda: 1.0
q_temperature: 1.0
value_loss: huber
value_target_normalization: batch_std
value_target_std_floor: 0.01
max_grad_norm: 0.5
target_kl: 0.02
learning_rate: 0.00002
actor_learning_rate: 0.00002
shared_learning_rate: 0.000005
critic_learning_rate: 0.00004
total_updates: 1200
warmup_fraction: 0.02
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 0.00001
weight_decay: 0.01

# 稳定性:V16 SFT 只训了 Actor,value/Q scorer 为随机初始化。前 40 updates
# 冻结 Actor/shared、只训 critic + Q,再联合训练;Q loss 经共享表示的梯度
# 缩放到 0.25,并用 U 形 KL 锚把策略约束在冻结 SFT reference 附近。
critic_bootstrap_updates: 40
critic_bootstrap_learning_rate: 0.00002
critic_public_grad_scale: 0.25
sft_kl_coef_start: 0.005
sft_kl_coef_middle: 0.0005
sft_kl_coef_end: 0.002
sft_kl_middle_fraction: 0.5

checkpoint_interval_updates: 30
checkpoint_dir: checkpoints/train_riichi_v16/ppo
resume: null

opponent_mix:
  enabled: true
  current_frac: 1.0
  sft_frac: 0.0
  historical_frac: 0.0
  random_frac: 0.0
  historical_min_update: 60
  historical_lag_updates: 60

# 唯一评测机制 1v3:可变项(对手/种子/设备/输出目录)由本配置显式给出。
eval1v3_enabled: true
eval1v3_model_b: checkpoints/train_riichi_v16/sft/best.pt
eval1v3_seed_base: 20260816
# 本次 V16 运行仅用物理 GPU 0:10 个评测分片子进程全部落在 cuda:0。
eval1v3_devices: ["0", "0"]
eval1v3_output_dir: audit/reports/v16/eval

progress_update_interval_updates: 60
