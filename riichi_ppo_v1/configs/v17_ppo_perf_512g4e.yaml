# V17 PPO 性能基准(标准基线):games_per_update=512 / update_epochs=4 /
# target_kl=0.0 / learner_gpus=2。自包含完整配置,不与打包默认叠加。
# 仅用于性能基准;启用了 RolloutBuffer SoA 一次性物化(path update_use_soa=true)。
seed: 1
device: cuda
learner_gpus: 2
# 性能基准只跑 3 轮(第 1 轮预热,第 2、3 轮作统计)。
iterations: 3
model_size: v16
context_tokens: 4096
policy_head_type: symmetric_action_query
critic_layers: 2
inference_dtype: bf16
game_mode: 4p-red-half

init_model: checkpoints/train_riichi_v16/sft/best.pt
grp_checkpoint: checkpoints/train_riichi_v17/grp/best.pt

num_workers: 12
envs_per_worker: 32
env_step_threads: 4
rollout_worker_num_cpus: 2
rollout_worker_cpu_threads: 1
worker_return_soa: true
inference_max_batch_size: 512
inference_batch_wait_ms: 8.0
inference_batch_target_rows: 0
inference_batch_target_workers: 0
games_per_update: 512

gamma: 1.0
ppo_clip: 0.2
update_epochs: 4
minibatch_size: 1536
gradient_accumulation_steps: 1
update_batch_mode: streaming
# 性能基准使用 SoA 一次性物化(默认 true,此处显式声明)。
update_use_soa: true
entropy_start: 0.01
entropy_end: 0.003
value_coef: 0.5
gae_lambda: 0.95
value_loss: huber
value_target_normalization: batch_std
value_target_std_floor: 0.01
max_grad_norm: 0.75
target_kl: 0.0
learning_rate: 0.00003
actor_learning_rate: 0.00003
actor_learning_rate_min: 0.000005
shared_learning_rate: 0.000005
shared_learning_rate_min: 0.00000125
critic_learning_rate: 0.00004
critic_learning_rate_min: 0.00001
total_updates: 150
warmup_fraction: 0.02
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 0.00001
weight_decay: 0.01

critic_bootstrap_updates: 2
critic_bootstrap_learning_rate: 0.00002
critic_public_grad_scale: 0.25
sft_kl_coef_start: 0.0025
sft_kl_coef_middle: 0.001
sft_kl_coef_end: 0.002
sft_kl_middle_fraction: 0.5

checkpoint_interval_updates: 99999
checkpoint_dir: checkpoints/train_riichi_v17/perf_512g4e
resume: null

opponent_mix:
  enabled: false

eval1v3_enabled: false
progress_update_interval_updates: 99999
