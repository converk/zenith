# V15 SFT stage A: learn only the zero-initialized offense projection.
seed: 1
learner_gpus: 2
model_size: mid
context_tokens: 4096
policy_head_type: isolated_action_query
offense_fusion: true
critic_head_type: action_value
trainable_scope: offense_projection
train_critic: false
train_public_value: false
public_value_coef: 0.0
epochs: 1
max_train_steps: 15000
batch_size: 512
learning_rate: 0.0001
min_learning_rate: 0.00001
warmup_fraction: 0.02
validation_samples_per_run: 0
save_initial_checkpoint: true
validate_initial_checkpoint: true
init_model: checkpoints/train_riichi_v13/sft/best_heuristic.pt
logit_drift_reference_model: checkpoints/train_riichi_v13/sft/best_heuristic.pt
checkpoint_dir: checkpoints/train_riichi_v15/sft/stage_a
