# V18 PPO 性能 A/B 基准配置(自包含,不与任何配置叠加)。
# 以 v18_ppo.yaml 全文为底本复制,仅允许改动以下键(§8 A/B 协议):
#   iterations/total_updates: 3、games_per_update: 512、update_epochs: 4、
#   target_kl: 0.0、eval1v3_enabled: false、
#   checkpoint_dir: checkpoints/train_riichi_v18/ppo_perftest。
# 其余键(minibatch 1536 / accumulation 10 / 12 worker / 32 env / wait 16ms 等)
# 与生产配置逐键一致;本文件只作短程性能基准,不是训练配置。
seed: 20260828
device: cuda
learner_gpus: 2
iterations: 3
total_updates: 3
model_size: v18
context_tokens: 256
policy_head_type: current_state_snapshot
critic_layers: 2
inference_dtype: bf16
game_mode: 4p-red-half

# V18 前置产物:SFT 初始化/参考策略与冻结 GRP reward。
init_model: checkpoints/train_riichi_v18/sft/best.pt
grp_checkpoint: checkpoints/train_riichi_v18/grp/best.pt

# Rollout 与推理拓扑。
num_workers: 12
envs_per_worker: 32
env_step_threads: 4
rollout_worker_num_cpus: 2
rollout_worker_cpu_threads: 1
# 推理与 learner 共用同一批 GPU(Ray num_gpus=1 自动分配,固定 2 卡)。
inference_max_batch_size: 512
inference_batch_wait_ms: 16.0
inference_batch_target_rows: 0
inference_batch_target_workers: -1
games_per_update: 512

# PPO 主超参:与生产配置逐键一致(update_epochs 按 A/B 协议固定为 4)。
gamma: 1.0
gae_lambda: 0.95
ppo_clip: 0.20
update_epochs: 4
minibatch_size: 1536
gradient_accumulation_steps: 10
update_batch_mode: streaming
bucket_window_multiplier: 8
# B1 新增键:与生产配置保持一致(训练期跳过前向结构校验)。
update_validate_structure: false

# critic 侧降温:0.5→0.3,直接压低 critic 分支 pre-clip 梯度,并同步降低
# 回流 shared 公共表示的 value 梯度。
value_coef: 0.3
value_loss: huber
value_target_normalization: batch_std
value_target_std_floor: 0.01

# 三点分段 entropy schedule,loss 使用按合法动作数归一化的 entropy。
entropy_loss_mode: normalized
entropy_start: 0.014
entropy_middle: 0.006
entropy_end: 0.002
entropy_middle_fraction: 0.33

# 三分支独立学习率调度,bootstrap 不消耗 policy schedule(与生产配置一致)。
learning_rate: 0.00009
actor_learning_rate: 0.00009
actor_learning_rate_min: 0.0000225
shared_learning_rate: 0.0000075
shared_learning_rate_min: 0.00000375
critic_learning_rate: 0.00008
critic_learning_rate_min: 0.0000225
critic_bootstrap_learning_rate: 0.00002
warmup_fraction: 0.02
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 0.00001
weight_decay: 0.0

# 稳定性:分支裁剪、critic 公共/私有 embedding 梯度隔离、old-policy KL guardrail。
# target_kl=0.0 为性能基准约定(禁用 KL guardrail,AGENTS.md 基线要求)。
critic_bootstrap_updates: 2
max_grad_norm: 0.5
actor_max_grad_norm: 0.5
shared_max_grad_norm: 0.5
critic_max_grad_norm: 0.5
critic_public_grad_scale: 0.25
critic_private_embedding_grad_scale: 0.25
target_kl: 0.0
target_kl_check_interval: 8

# SFT reference KL:与生产配置一致(perftest 仍覆盖 sft_kl_coef>0 路径)。
sft_kl_coef_start: 0.0025
sft_kl_coef_middle: 0.001
sft_kl_coef_end: 0.0005
sft_kl_middle_fraction: 0.5

# 每 5 updates 保存 checkpoint;3 updates 的基准不会触发中途保存。
checkpoint_interval_updates: 5
update_timeout_s: 1800
eval1v3_interval_updates: 5
# A/B 基准专用输出目录(与生产 checkpoint 隔离;每轮 A/B 后整体删除)。
checkpoint_dir: checkpoints/train_riichi_v18/ppo_perftest
resume: null

opponent_mix:
  enabled: false

# 基准关闭 1v3 评测(正确性不受影响,纯性能对比)。
eval1v3_enabled: false
eval1v3_model_b: checkpoints/train_riichi_v18/sft/best.pt
eval1v3_seed_base: 20260827
eval1v3_devices: ["0", "1"]
eval1v3_parallel_hanchans: 200
eval1v3_output_dir: audit/reports/v18/eval

progress_update_interval_updates: 10
