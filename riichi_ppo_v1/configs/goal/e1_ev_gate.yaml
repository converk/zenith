# E1：EV 门控 / 四席组内基线（RLOO/GRPO 式）。
# 假设：稀疏终局 reward 下 critic 噪声主导，EV<0 时 GAE 优势≈带噪 MC 收益；
# 改用「MC 折扣收益 − 同小局同 step 四席 leave-one-out 基线」恢复学习信号。
# value loss 仍使用 GAE return（只替换 policy 优势项）。
adv_estimator: ev_gate
ev_gate_threshold: 0.0
ev_gate_min_group: 2

# 与 E0 相同的长期训练约定（只改 adv_estimator 一个算法变量）。
kyokus_per_worker: 16
iterations: 200
checkpoint_interval_updates: 50
checkpoint_dir: checkpoints/train_riichi_ppo_goal_e1_ev_gate
init_model: checkpoints/train_riichi_v13_sft/best_heuristic.pt
evaluation_enabled: true
evaluation_interval_updates: 15
evaluation_hanchan_count: 96
