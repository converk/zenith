# E0 基线复现：无算法改动，仅按长期训练约定覆盖 rollout 参数。
# 从 best_heuristic.pt 初始化、seed=1（packaged training.yaml 已固定 seed: 1）。
# 冒烟/性能测试约定（target_kl=0.0 / update_epochs=4 / kyokus_per_worker=1）
# 已在 e0_smoke 完成；此处是 200-update 长期基线。
kyokus_per_worker: 16
iterations: 200
checkpoint_interval_updates: 50
checkpoint_dir: checkpoints/train_riichi_ppo_goal_e0_baseline
init_model: checkpoints/train_riichi_v13_sft/best_heuristic.pt
# 每 15 update 固定启发式评测（monitoring.yaml 默认已开启 96 半庄）。
evaluation_enabled: true
evaluation_interval_updates: 15
evaluation_hanchan_count: 96
