# E3-b + E2 组合臂（非计划新增，依据 E0–E3 证据追加）：
# - E3-b 纯 GRP reward：u200 2v2=55.8%、CI [1152,9579] 不跨 0（唯一显著为正的臂）；
# - E2 对手混合 80/20：启发式 u100 后一位率最稳（u180=42.7%，E0 同期 31.3%）。
# 目标：在保留显著 2v2 优势的同时，消除“对固定启发式 u100 后退化”。
grp_model_path: checkpoints/train_riichi_ppo_goal_grp/grp_rank_predictor.pt
grp_pts_weight: [10, 4, -4, -10]
grp_mix_lambda: 1.0
opponent_mix:
  enabled: true
  current_frac: 0.8
  sft_frac: 0.2
  random_frac: 0.0

kyokus_per_worker: 16
iterations: 200
checkpoint_interval_updates: 50
checkpoint_dir: checkpoints/train_riichi_ppo_goal_e3b_e2_combo
init_model: checkpoints/train_riichi_v13_sft/best_heuristic.pt
evaluation_enabled: true
evaluation_interval_updates: 15
evaluation_hanchan_count: 96
