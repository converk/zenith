# V16-small SFT 从零训练(双卡 CUDA_DEVICE=0,3):自包含完整配置,不与打包默认叠加。
# 输入为 V16 编码(Objective Facts + Compact Snapshot + 每动作一对 Query),
# 网络为 symmetric_action_query(v16-small preset);checkpoint 与日志固定到 v16 产物。
# 节奏键(每 3000 steps 验证/保存、最终 96 半庄)不在本文件复制,由
# sft/contract.py 的机制常量单一来源提供;V16 启发式评测待 V16 PPO 推理路径
# (Phase 6)落地后开启。
seed: 1
device: cuda
learner_gpus: 2
model_size: v16
context_tokens: 4096
policy_head_type: symmetric_action_query
dataset: datasets/tenhou_sft_2024_2025_encoded_60pct_v16
epochs: 1
train_critic: false
train_public_value: false
batch_size: 512
learning_rate: 0.00015
min_learning_rate: 0.00002
warmup_fraction: 0.02
weight_decay: 0.01
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 0.00000001
max_grad_norm: 1.0
gamma: 0.99
inference_dtype: bf16
shuffle_buffer_kyokus: 8192
length_bucket_window_batches: 32
log_interval_steps: 100
validation_max_samples: 0
validation_samples_per_run: 150000
heuristic_evaluation_enabled: false
checkpoint_dir: checkpoints/train_riichi_v16/sft
tensorboard_enabled: true
tensorboard_dirname: tensorboard
resume: null
init_model: null
