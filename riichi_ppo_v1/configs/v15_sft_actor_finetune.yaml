# V15 SFT stage B: fine-tune the complete actor from stage A's validation winner.
seed: 2
learner_gpus: 2
model_size: mid
context_tokens: 4096
policy_head_type: isolated_action_query
offense_fusion: true
critic_head_type: action_value
trainable_scope: full_actor
train_critic: false
train_public_value: false
public_value_coef: 0.0
epochs: 1
max_train_steps: 30000
batch_size: 512
learning_rate: 0.00002
min_learning_rate: 0.000002
warmup_fraction: 0.02
validation_samples_per_run: 0
heuristic_evaluation_enabled: true
init_model: checkpoints/train_riichi_v15/sft/stage_a/best.pt
logit_drift_reference_model: checkpoints/train_riichi_v13_sft/best_heuristic.pt
checkpoint_dir: checkpoints/train_riichi_v15/sft/stage_b
