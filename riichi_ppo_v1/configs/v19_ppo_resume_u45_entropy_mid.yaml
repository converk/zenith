# V19 PPO 恢复训练配置(自包含完整副本,基于 v19_ppo.yaml,2026-09-08)。
# 背景:原运行(ppo_train_v19_s20260908.log)于 update 48 后因会话中断停止
# (日志无异常栈,u50 存盘点未到),最新落盘 checkpoint 为 update 45。
# 本配置从 checkpoint_00045.pt 精确恢复(model/optimizer/iteration/RNG),
# u46–48 的进度未落盘、将被重跑,属精确 resume 的预期语义。
#
# 唯一变更:entropy 三点调度收紧(熵下降速度介于 V18 与原 V19 之间)。
#   原 V19:0.018 / 0.010 @0.5 / 0.004(middle_fraction=0.5)——实测 u1–48
#   熵仅 0.50→0.47,下降过慢;
#   V18:0.014 / 0.006 @0.33 / 0.002——u1–150 熵 0.478→0.175,前期收敛过快。
#   本配置取两代中间值:0.016 / 0.008 @0.4 / 0.003——全调度逐点严格介于
#   V18 与原 V19 之间;恢复点 u46 起 bonus 由 0.0144 降至 0.0114(约 -20%),
#   熵均衡点下移、下降加快,但探索压力始终高于 V18。
#   entropy_floor=0.25 / entropy_floor_coef=0.02 保持不变:熵逼近 0.25 时
#   屏障照常生效,保证不会像 V18 那样降至 0.175。
# 第二处变更:torch_compile: true(恢复运行提速,见下方 Tier 2 块说明);
# torch_compile_reference 维持 false。
# 其余键与 v19_ppo.yaml 完全一致(含 seed、LR、ckpt/评测节奏、拓扑)。

seed: 20260908
device: cuda
learner_gpus: 2
iterations: 200
total_updates: 200
model_size: v19
layers: 5
shared_layers: 3
context_tokens: 320
policy_head_type: current_state_snapshot
critic_layers: 1
inference_dtype: bf16
game_mode: 4p-red-half

# V19 前置产物:resume 与 init_model 互斥,恢复时 init_model 必须为 null
# (模型/optimizer/iteration 全部来自 resume checkpoint)。
init_model: null
grp_checkpoint: checkpoints/train_riichi_v19/grp/best.pt
grp_temperature: 0.3

# Rollout 与推理拓扑。
num_workers: 12
envs_per_worker: 32
env_step_threads: 4
rollout_worker_num_cpus: 2
rollout_worker_cpu_threads: 1
inference_max_batch_size: 512
inference_batch_wait_ms: 16.0
inference_batch_target_rows: 0
inference_batch_target_workers: -1
games_per_update: 2048

# PPO 主超参:Actor 用归一化 advantage,Critic 拟合 old_value + raw GAE。
gamma: 1.0
gae_lambda: 0.95
ppo_clip: 0.20
update_epochs: 2
minibatch_size: 2048
gradient_accumulation_steps: 10
update_batch_mode: streaming
bucket_window_multiplier: 8
update_validate_structure: false

# Tier 2 性能开关(既定基线)。
# torch_compile 开启(2026-09-08 恢复运行提速):V18 实测 fwd -39% / bwd -61%,
# 本运行 update 墙钟 ~660s 预计降至 ~400-450s(收集 ~260s 非瓶颈,总墙钟由
# update 决定)。注意:首个 update 为 dynamo/inductor 编译 warmup(约 10-20
# 分钟,期间 recompile 告警刷屏属预期,V18 稳态实测零重编译);训练轨迹相对
# eager 漂移(数学等价、浮点归约顺序改变,V18 已批准的 △ 级折衷)。
torch_compile: true
rollout_update_overlap: true
# reference 不编译:V19 显式关闭(默认应跟随 torch_compile),SFT-KL 前向
# (reference_precompute)保持 eager;该路径在 V19 无实测数据,不随本次提速开启。
torch_compile_reference: false
learner_shard_transport: shm

# critic 侧降温、value target 归一化。
value_coef: 0.3
value_loss: huber
value_target_normalization: batch_std
value_target_std_floor: 0.01

# 三点分段 entropy schedule(本次唯一实质变更,见文件头说明)。
entropy_loss_mode: normalized
entropy_start: 0.016
entropy_middle: 0.008
entropy_end: 0.003
entropy_middle_fraction: 0.4
# 熵地板屏障:与原 V19 一致,batch 均 raw 熵跌破 0.25 时施加 0.02 系数推力。
entropy_floor: 0.25
entropy_floor_coef: 0.02

# 三分支独立学习率调度。
learning_rate: 0.00009
actor_learning_rate: 0.00009
actor_learning_rate_min: 0.0000225
shared_learning_rate: 0.0000075
shared_learning_rate_min: 0.00000375
critic_learning_rate: 0.00008
critic_learning_rate_min: 0.0000225
critic_bootstrap_learning_rate: 0.00002
warmup_fraction: 0.02
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 0.00001
weight_decay: 0.0

# 稳定性:分支裁剪、critic 公共/私有 embedding 梯度隔离、old-policy KL guardrail。
critic_bootstrap_updates: 4
max_grad_norm: 0.5
actor_max_grad_norm: 0.5
shared_max_grad_norm: 0.5
critic_max_grad_norm: 0.5
critic_public_grad_scale: 0.25
critic_private_embedding_grad_scale: 0.25
target_kl: 0.01
target_kl_check_interval: 8

# SFT reference KL。
sft_kl_coef_start: 0.0025
sft_kl_coef_middle: 0.001
sft_kl_coef_end: 0.0005
sft_kl_middle_fraction: 0.5

# V19 信念键(2026-09-07 模糊化 + 归一化均衡;λ 默认 1.0)。
belief_public_grad_scale: 0.25
belief_head_weight_hand: 1.0
belief_head_weight_shanten: 1.0
belief_head_weight_wait: 1.0
belief_head_weight_danger: 1.0
belief_head_weight_loss: 1.0
belief_sft_coef: 1.0
belief_readout_enabled: true
belief_readout_detach: true
belief_danger_pos_weight: 5.0
belief_loss_positive_weight: 20.0

# 保存与评测节奏(机制常量见 evaluation/mechanism.py)。
checkpoint_interval_updates: 5
update_timeout_s: 1800
eval1v3_interval_updates: 5
checkpoint_dir: checkpoints/train_riichi_v19/ppo
# 恢复点:u45(中断运行 u48 后停止,u50 未到存盘点)。
resume: checkpoints/train_riichi_v19/ppo/checkpoint_00045.pt

opponent_mix:
  enabled: false

eval1v3_enabled: true
eval1v3_model_b: checkpoints/train_riichi_v19/sft/best.pt
eval1v3_hanchans_per_process: 600
eval1v3_seed_base: 10260908
# 1v3 评测设备:项目 CUDA_DEVICE 编号(2→物理GPU3,3→物理GPU4);
# 分片子进程按 CUDA_DEVICE 重新映射,双卡各 5 进程不变。
eval1v3_devices: ["2", "3"]
eval1v3_parallel_hanchans: 300
eval1v3_output_dir: audit/reports/v19/eval

progress_update_interval_updates: 10
grad_term_diagnostics_interval_updates: 10
