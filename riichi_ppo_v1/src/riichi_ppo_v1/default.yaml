seed: 1
device: cuda
model_size: mid
num_workers: 4
envs_per_worker: 32
env_step_threads: 4
profile_enabled: true
profile_cuda_sync: true
gpu_monitor: true
gpu_sample_interval_s: 0.25
inference_dtype: bf16
# Dynamic cached sequence lengths trigger repeated TorchInductor graphs;
# enable only for fixed-length benchmarking.
inference_compile: false
inference_max_batch_size: 512
inference_batch_wait_ms: 1.0
rollout_kv_cache: true
inference_kv_max_buckets: 4
kyokus_per_worker: 16
game_mode: 4p-red-half
learning_rate: 0.0003
gamma: 1.0
gae_lambda: 0.95
ppo_clip: 0.2
update_epochs: 4
minibatch_size: 256
entropy_coef: 0.01
value_coef: 0.5
max_grad_norm: 0.5
target_kl: 0.02
reward_scale: 8000.0
reward_limit: 3.0
iterations: 1000
checkpoint_dir: checkpoints/riichi_ppo_v1
checkpoint_interval: 25
eval_games: 16
resume: null
